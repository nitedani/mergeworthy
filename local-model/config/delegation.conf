# Delegation level for Claude sessions (read by `claude-usage --mode`).
mode = routine            # the normal level: off | routine | execute
escalate_to = execute     # used when the weekly budget would run out before it refills
pace_margin = 20%         # escalate if, at this much above your measured pace, the budget runs out before the reset
deescalate_margin = 50%   # back to `mode` when, at your last 6 hours' pace, it lasts this much past the reset...
deescalate_after = 2      # ...and has for this many hours (a weekly reset also ends the escalation)
